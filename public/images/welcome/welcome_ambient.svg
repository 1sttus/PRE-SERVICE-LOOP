<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3d2a1d" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#1f1816" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c0d10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="beam1" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#e5c158" stop-opacity="0.18"/>
