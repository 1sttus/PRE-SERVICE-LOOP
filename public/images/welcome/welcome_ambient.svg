  <rect width="1920" height="1080" fill="url(#stageGlow)"/>
  <circle cx="1400" cy="450" r="500" fill="url(#warmLight)"/>
  <polygon points="400,0 650,0 900,1080 300,1080" fill="url(#beam1)"/>
