<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="sanctuaryBack" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2c1e19" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#141418" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0a0d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="centerStage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#3a131b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c0d10" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sanctuaryBack)"/>
  <!-- Stage light cone -->
  <polygon points="960,100 680,1080 1240,1080" fill="url(#centerStage)"/>
  <ellipse cx="960" cy="850" rx="400" ry="120" fill="#c5a059" opacity="0.08"/>
  <!-- Stage backdrop glow -->
  <line x1="200" y1="880" x2="1720" y2="880" stroke="#d4af37" stroke-width="1.5" opacity="0.2"/>
  <line x1="350" y1="920" x2="1570" y2="920" stroke="#8c7853" stroke-width="1" opacity="0.12"/>
  <circle cx="960" cy="300" r="180" fill="#e5c158" opacity="0.06"/>
</svg>
